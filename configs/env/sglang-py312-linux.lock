# Resolved SGLang environment for Session 1 — a RECORD, not an install input.
#
# Generated on the Mac with uv (uv 0.11.26) against the fork at the pinned
# telemetry commit f9281ec128, resolved for the GPU host's platform:
#
#     uv pip compile --python-platform x86_64-unknown-linux-gnu \
#         --python-version 3.12 /workspace/sglang/python/pyproject.toml
#
# WHY THIS FILE EXISTS
#   SGLang's pyproject has no lockfile, so `pip install -e python/` re-resolves
#   204 packages on every fresh pod. Without a record, nothing proves that
#   Session 2 ran the same environment as Session 1 -- and comparability across
#   sessions is the whole point.
#
# HOW TO USE IT
#   The session installs with pip, exactly as SGLang's own Dockerfile does. On
#   the host, after the bootstrap:
#
#       python -m pip freeze | sort > /tmp/actual.txt
#       grep -E '^[a-zA-Z0-9_.-]+==' configs/env/sglang-py312-linux.lock \
#           | sort > /tmp/expected.txt
#       diff /tmp/expected.txt /tmp/actual.txt
#
#   Differences are not automatically errors -- pip honours the preinstalled
#   image -- but they must be *seen* before a result is called comparable.
#
# Verified: this resolution selects the same critical pins SGLang declares, so
# switching installers would not have changed them:
#     torch==2.13.0   flashinfer-python==0.6.18
#     cuda-tile==1.6.0rc5   cuda-python==13.4.1
#
# NOTE: flashinfer-cubin / flashinfer-jit-cache are NOT part of this resolution.
# SGLang's Dockerfile installs them separately from https://flashinfer.ai/whl.
# The session runs attention_backend=triton, so flashinfer is off the attention
# path; the untimed warm-up is what absorbs any first-call JIT.
